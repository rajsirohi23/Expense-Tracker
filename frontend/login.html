<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrak — Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo-area">
        <a href="index.html" style="display:inline-block;">
          <div class="auth-logo">F</div>
        </a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your FinTrak account</p>
      </div>

      <div class="auth-card">
        <div id="successMsg" class="form-success" style="display:none;">
          <span>✅</span> Login successful! Redirecting…
        </div>
        <div id="errorMsg" style="display:none;margin-bottom:16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:12px 16px;font-size:13px;color:#ef4444;display:flex;align-items:center;gap:8px;"></div>

        <div class="auth-form" id="loginForm">
          <div class="form-group">
            <label class="floating-label" for="email">Email Address</label>
            <div class="floating-input-wrap">
              <input class="auth-input" type="email" id="email" placeholder="you@example.com" autocomplete="email"
                onkeydown="if(event.key==='Enter')login()">
            </div>
            <div class="error-msg" id="emailError" style="display:none;">⚠ Please enter a valid email</div>
          </div>

          <div class="form-group">
            <label class="floating-label" for="password">Password</label>
            <div class="floating-input-wrap">
              <input class="auth-input password-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password"
                onkeydown="if(event.key==='Enter')login()">
              <button class="password-toggle" type="button" id="pwToggle" onclick="togglePw('password','pwToggle')">👁</button>
            </div>
            <div class="error-msg" id="passwordError" style="display:none;">⚠ Password is required</div>
          </div>

          <div style="display:flex;justify-content:flex-end;margin-bottom:20px;">
            <a href="#" style="font-size:13px;color:var(--accent-purple);">Forgot password?</a>
          </div>

          <button class="auth-submit btn" type="button" id="loginBtn" onclick="login()">
            <span id="loginBtnText">Sign In</span>
            <span id="loginSpinner" style="display:none;"><span class="spinner"></span></span>
          </button>
        </div>

        <!-- <div class="auth-divider"><span>or continue with</span></div> -->

        <!-- <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <button class="btn btn-ghost" onclick="demoLogin()" style="justify-content:center;font-size:13px;">
            🎮 Demo Account
          </button>
          <button class="btn btn-ghost" style="justify-content:center;font-size:13px;">
            🌐 Google
          </button>
        </div> -->
        
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one free</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="js/auth.js"></script>
  <script>
    function demoLogin() {
      document.getElementById('email').value = 'demo@fintrak.in';
      document.getElementById('password').value = 'demo1234';
      login();
    }
  </script>
</body>
</html>
